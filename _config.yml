# Métadonnées de la brique
brique:
  name: 'SQL Fondamentaux'
  color: teal
  level: 2
  logo: /assets/img/logo.png
  status: 'development'
  prev_level_url: '/sql-fondamentaux-brique-1'
  next_level_url: '/sql-fondamentaux-brique-3'

# Analytics (optionnel) — décommenter et configurer pour activer
# analytics:
#   provider: plausible # plausible, matomo, ou google
#   plausible:
#     domain: example.com
#     src: https://plausible.io/js/script.js
#   matomo:
#     url: https://matomo.example.com
#     site_id: 1
#   google:
#     id: G-XXXXXXXXXX

title: 'SQL Fondamentaux Niveau 2 - BriqueParBrique'
description: 'Apprendre à transformer et combiner les données avec SQL'
url: 'https://briqueparbrique.github.io'
baseurl: '/sql-fondamentaux-brique-2'
repository: 'BriqueParBrique/sql-fondamentaux-brique-2'

collections:
  steps:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ''
      type: steps
    values:
      layout: step

exclude:
  - README.md
  - DEVELOPER.md
  - CONTRIBUTING.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - justfile
  - LICENSE
